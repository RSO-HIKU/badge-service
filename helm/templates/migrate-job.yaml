apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "badge-service.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "badge-service.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.gitops.enabled }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    {{- else }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- end }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "badge-service.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.azure.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "badge-service.fullname" . }}-azure-kv
      {{- end }}
      containers:
        - name: flyway
          image: "{{ .Values.flyway.image.repository }}:{{ .Values.flyway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.flyway.image.pullPolicy | default "IfNotPresent" }}
          {{- if .Values.azure.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # Read secrets from CSI mounted files
              export FLYWAY_USER=$(cat /mnt/secrets-store/badge-db-user)
              export FLYWAY_PASSWORD=$(cat /mnt/secrets-store/badge-db-password)
              export PGHOST=$(cat /mnt/secrets-store/pg-host)
              export FLYWAY_URL="jdbc:postgresql://${PGHOST}:{{ .Values.azure.port }}/{{ .Values.azure.database }}?sslmode={{ .Values.azure.sslmode }}&currentSchema={{ .Values.database.schema }},public"
              
              exec flyway migrate
          {{- else }}
          args: ["migrate"]
          {{- end }}
          env:
            - name: FLYWAY_SCHEMAS
              value: {{ .Values.database.schema | quote }}
            - name: FLYWAY_DEFAULT_SCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: FLYWAY_CREATE_SCHEMAS
              value: {{ ternary "false" "true" .Values.gitops.enabled | quote }}
            {{- if .Values.database.enabled }}
            # Dev: use Kubernetes secret
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "badge-service.fullname" . }}-db
                  key: FLYWAY_URL
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "badge-service.fullname" . }}-db
                  key: DB_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "badge-service.fullname" . }}-db
                  key: DB_PASS          
            {{- end }}
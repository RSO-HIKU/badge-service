replicaCount: 1

environment: dev

image:
  repository: badge-service
  tag: dev-latest
  pullPolicy: Never

database:
  enabled: true
  host: postgres.database.svc.cluster.local
  port: "5432"
  name: hikudb
  schema: badge_service

azure:
  enabled: false

gitops:
  enabled: false

dbPool:
  poolMaxSize: 3

service:
  clusterIP:
    port: 8087
    address: "0.0.0.0"

  nodePort:
    enabled: true
    port: 8087
    nodePort: 30087

flyway:
  image:
    repository: badge-service-migrator
    tag: "dev"

jwtAuth:
  issuer: "http://localhost:8080/auth/realms/hiku-dev"
  jwksUri: "http://keycloak.keycloak.svc.cluster.local:8080/auth/realms/hiku-dev/protocol/openid-connect/certs"

# Health check probe configuration
health:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
